<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D'SEA | Registro</title>
    
    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        espresso: '#2B211D',
                        cafeTostado: '#694430',
                        caramelo: '#B57A50',
                        mango: '#E29A53',
                        cremaVainilla: '#FAF4EC',
                        blancoCalido: '#FFFCF8',
                        rosaFresa: '#D59B9C',
                        borderBeige: '#E4D7CA',
                    },
                    fontFamily: {
                        playfair: ['"Playfair Display"', 'serif'],
                        sans: ['"DM Sans"', 'sans-serif'],
                    },
                    borderRadius: {
                        'xl-custom': '24px',
                        'lg-custom': '16px',
                        'md-custom': '12px',
                    }
                }
            }
        }
    </script>

    <!-- Archivo de Estilos Personalizados -->
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="registro" class="min-h-screen flex flex-col justify-between selection:bg-rosaFresa selection:text-white bg-cremaVainilla">

    <!-- Encabezado / Barra de Navegación en Blanco Cálido (#FFFCF8) -->
    <header class="w-full bg-blancoCalido py-4 px-6 md:px-12 border-b border-borderBeige/40 shadow-sm">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            
            <!-- Enlaces de navegación a la izquierda -->
            <nav class="flex items-center space-x-6 text-sm font-medium">
                <a href="inicio.html" class="text-cafeTostado/80 hover:text-espresso font-medium transition-colors">Inicio</a>
                <a href="menu.html" class="text-cafeTostado/80 hover:text-espresso font-medium transition-colors">Menú</a>
            </nav>

            <!-- Logo en el centro -->
            <div class="flex items-center justify-center">
                <a href="inicio.html" class="flex flex-col items-center focus:outline-none group">
                    <div class="relative h-12 w-32 sm:w-40 flex items-center justify-center">
                        <img 
                            src="logo_dsea.png" 
                            alt="Logo D'SEA" 
                            class="max-h-full max-w-full object-contain"
                            onerror="this.src='logo_dsea';"
                        />
                    </div>
                </a>
            </div>

            <!-- Botones de acción a la derecha -->
            <div class="flex items-center space-x-3">
                <a href="iniciosesion.html" class="px-5 py-1.5 rounded-full border border-espresso text-espresso text-sm font-medium hover:bg-espresso hover:text-cremaVainilla transition-all duration-200 inline-block text-center">
                    Ingresar
                </a>
                <a href="registro.html" class="px-5 py-1.5 rounded-full bg-espresso text-cremaVainilla text-sm font-medium hover:bg-cafeTostado transition-all duration-200 shadow-sm inline-block text-center">
                    Únete
                </a>
            </div>
        </div>
    </header>

    <!-- Área de contenido principal en Crema Vainilla (#FAF4EC) -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 md:px-12 py-8 md:py-12 flex items-center">
        
        <!-- Tarjeta principal de Registro en Blanco Cálido -->
        <section class="w-full bg-blancoCalido rounded-xl-custom shadow-sm border border-borderBeige/50 overflow-hidden relative p-8 md:p-16 flex flex-col md:flex-row items-center gap-12">
            
            <!-- Lado izquierdo: Logo grande decorativo -->
            <div class="w-full md:w-1/2 flex items-center justify-center p-6">
                <div class="w-full max-w-xs sm:max-w-sm flex items-center justify-center">
                    <img 
                        src="logo_dsea.png" 
                        alt="D'SEA Logo Grande" 
                        class="w-full h-auto object-contain opacity-90"
                        onerror="this.src='logo_dsea';"
                    />
                </div>
            </div>

            <!-- Lado derecho: Formulario de Registro -->
            <div class="w-full md:w-1/2 flex flex-col justify-center space-y-5">
                <div class="space-y-1">
                    <h1 class="font-playfair text-3xl sm:text-4xl font-bold text-espresso">
                        Registrarse
                    </h1>
                    <p class="font-sans text-base sm:text-lg font-medium text-cafeTostado/80">
                        Crea tu cuenta para ordenar en segundos
                    </p>
                </div>

                <!-- Formulario estático con redirección en botón -->
                <form class="space-y-3.5 w-full" onsubmit="event.preventDefault();">
                    
                    <!-- Campo Nombre Completo -->
                    <div class="space-y-1">
                        <label class="block text-xs font-medium text-espresso uppercase tracking-wider">
                            Nombre Completo
                        </label>
                        <input 
                            type="text" 
                            class="w-full px-4 py-2 rounded-lg border border-borderBeige bg-white text-espresso text-sm focus:outline-none focus:border-caramelo transition-colors"
                            placeholder=""
                        >
                    </div>

                    <!-- Campo Correo electrónico -->
                    <div class="space-y-1">
                        <label class="block text-xs font-medium text-espresso uppercase tracking-wider">
                            Correo electrónico
                        </label>
                        <input 
                            type="email" 
                            class="w-full px-4 py-2 rounded-lg border border-borderBeige bg-white text-espresso text-sm focus:outline-none focus:border-caramelo transition-colors"
                            placeholder=""
                        >
                    </div>

                    <!-- Campo Teléfono -->
                    <div class="space-y-1">
                        <label class="block text-xs font-medium text-espresso uppercase tracking-wider">
                            Teléfono
                        </label>
                        <input 
                            type="tel" 
                            class="w-full px-4 py-2 rounded-lg border border-borderBeige bg-white text-espresso text-sm focus:outline-none focus:border-caramelo transition-colors"
                            placeholder=""
                        >
                    </div>

                    <!-- Campo Contraseña -->
                    <div class="space-y-1">
                        <label class="block text-xs font-medium text-espresso uppercase tracking-wider">
                            Contraseña
                        </label>
                        <input 
                            type="password" 
                            class="w-full px-4 py-2 rounded-lg border border-borderBeige bg-white text-espresso text-sm focus:outline-none focus:border-caramelo transition-colors"
                            placeholder=""
                        >
                    </div>

                    <!-- Campo Confirmar contraseña -->
                    <div class="space-y-1">
                        <label class="block text-xs font-medium text-espresso uppercase tracking-wider">
                            Confirmar contraseña
                        </label>
                        <input 
                            type="password" 
                            class="w-full px-4 py-2 rounded-lg border border-borderBeige bg-white text-espresso text-sm focus:outline-none focus:border-caramelo transition-colors"
                            placeholder=""
                        >
                    </div>

                    <!-- Botón Registrarse en color Mango con enlace a menú -->
                    <div class="pt-2">
                        <a 
                            href="menu.html" 
                            class="w-full py-3 rounded-xl bg-mango text-white font-medium text-sm hover:opacity-95 transition-opacity shadow-sm block text-center"
                        >
                            Registrarse
                        </a>
                    </div>

                </form>
            </div>

        </section>

    </main>

    <!-- Pie de página -->
    <footer class="w-full bg-rosaFresa py-8 px-6 md:px-12 mt-auto">
        <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 text-espresso">
            
            <!-- Columna 1: Ubicación -->
            <div class="space-y-2">
                <h3 class="font-playfair text-xl font-bold text-espresso">Ubicación</h3>
                <p class="font-sans text-sm font-medium leading-relaxed opacity-90">
                    BLVD. Atotonilco 2002,<br>
                    Brisas del Pedregal, León, Gto. 37295
                </p>
            </div>

            <!-- Columna 2: Horario -->
            <div class="space-y-2 md:text-center">
                <h3 class="font-playfair text-xl font-bold text-espresso">Horario</h3>
                <p class="font-sans text-sm font-medium leading-relaxed opacity-90">
                    Jueves a Domingo<br>
                    7:30 – 11:00
                </p>
            </div>

            <!-- Columna 3: Contáctanos -->
            <div class="space-y-2 md:text-right">
                <h3 class="font-playfair text-xl font-bold text-espresso">Contactanos</h3>
                <p class="font-sans text-sm font-medium leading-relaxed opacity-90">
                    479 430 00 14
                </p>
            </div>

        </div>
    </footer>

    <script src="dsea.js"></script>
</body>
</html>
