<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D'SEA | Acceso administrador</title>
    
    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        espresso: '#2B211D',
                        cafeTostado: '#694430',
                        caramelo: '#B57A50',
                        mango: '#E29A53',
                        cremaVainilla: '#FAF4EC',
                        blancoCalido: '#FFFCF8',
                        rosaFresa: '#D59B9C',
                        borderBeige: '#E4D7CA',
                    },
                    fontFamily: {
                        playfair: ['"Playfair Display"', 'serif'],
                        sans: ['"DM Sans"', 'sans-serif'],
                    },
                    borderRadius: {
                        'xl-custom': '24px',
                        'lg-custom': '16px',
                        'md-custom': '12px',
                    }
                }
            }
        }
    </script>

    <!-- Archivo de Estilos Personalizados -->
    <link rel="stylesheet" href="../Usuario/styles.css">
</head>
<body data-page="loginadmin" data-page="login" class="min-h-screen flex flex-col justify-between selection:bg-rosaFresa selection:text-white bg-cremaVainilla">

    <!-- Encabezado / Barra de Navegación en Blanco Cálido (#FFFCF8) -->
    <header class="w-full bg-blancoCalido py-4 px-6 md:px-12 border-b border-borderBeige/40 shadow-sm">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <span class="text-xs font-semibold text-cafeTostado uppercase tracking-wider">Panel administrador</span>
            <a href="iniciosesionadmin.html" class="relative h-12 w-32 sm:w-40 flex items-center justify-center"><img src="logo_dsea.png" alt="Logo D'SEA" class="max-h-full max-w-full object-contain"/></a>
            <a href="../Usuario/iniciosesion.html" class="text-xs font-medium text-cafeTostado/80 hover:text-espresso">Soy cliente</a>
        </div>
    </header>

    <!-- Área de contenido principal en Crema Vainilla (#FAF4EC) -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 md:px-12 py-8 md:py-12 flex items-center">
        
        <!-- Tarjeta principal de Inicio de Sesión en Blanco Cálido -->
        <section class="w-full bg-blancoCalido rounded-xl-custom shadow-sm border border-borderBeige/50 overflow-hidden relative p-8 md:p-16 flex flex-col md:flex-row items-center gap-12">
            
            <!-- Lado izquierdo: Logo grande decorativo -->
            <div class="w-full md:w-1/2 flex items-center justify-center p-6">
                <div class="w-full max-w-xs sm:max-w-sm flex items-center justify-center">
                    <img 
                        src="logo_dsea.png" 
                        alt="D'SEA Logo Grande" 
                        class="w-full h-auto object-contain opacity-90"
                        
                    />
                </div>
            </div>

            <!-- Lado derecho: Formulario de Ingreso -->
            <div class="w-full md:w-1/2 flex flex-col justify-center space-y-6">
                <div class="space-y-1">
                    <h1 class="font-playfair text-3xl sm:text-4xl font-bold text-espresso">
                        Acceso administrador
                    </h1>
                    <p class="font-sans text-base sm:text-lg font-medium text-cafeTostado/80">
                        Gestiona pedidos, menú y horarios
                    </p>
                </div>

                <!-- Formulario estático con redirección en el botón -->
                <form id="form-admin" class="space-y-4 w-full">
                    <div class="space-y-1.5">
                        <label class="block text-xs font-medium text-cafeTostado">Correo electrónico</label>
                        <input name="email" type="email" required class="w-full px-4 py-2.5 rounded-lg border border-borderBeige bg-white text-espresso text-sm focus:outline-none focus:border-caramelo transition-colors">
                    </div>
                    <div class="space-y-1.5">
                        <label class="block text-xs font-medium text-cafeTostado">Contraseña</label>
                        <input name="password" type="password" required class="w-full px-4 py-2.5 rounded-lg border border-borderBeige bg-white text-espresso text-sm focus:outline-none focus:border-caramelo transition-colors">
                    </div>
                    <div class="pt-2">
                        <button type="submit" class="w-full py-3 rounded-xl bg-espresso text-cremaVainilla font-medium text-sm hover:bg-cafeTostado transition-colors shadow-sm block text-center">Entrar al panel</button>
                    </div>
                    <p class="text-[11px] text-cafeTostado/70 text-center">Demo: <b>admin@dsea.mx</b> / <b>admin123</b></p>
                </form>
            </div>

        </section>

    </main>

    <!-- Pie de página -->
    <footer class="w-full bg-rosaFresa py-8 px-6 md:px-12 mt-auto">
        <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 text-espresso">
            
            <!-- Columna 1: Ubicación -->
            <div class="space-y-2">
                <h3 class="font-playfair text-xl font-bold text-espresso">Ubicación</h3>
                <p class="font-sans text-sm font-medium leading-relaxed opacity-90">
                    BLVD. Atotonilco 2002,<br>
                    Brisas del Pedregal, León, Gto. 37295
                </p>
            </div>

            <!-- Columna 2: Horario -->
            <div class="space-y-2 md:text-center">
                <h3 class="font-playfair text-xl font-bold text-espresso">Horario</h3>
                <p class="font-sans text-sm font-medium leading-relaxed opacity-90">
                    Jueves a Domingo<br>
                    7:30 – 11:00
                </p>
            </div>

            <!-- Columna 3: Contáctanos -->
            <div class="space-y-2 md:text-right">
                <h3 class="font-playfair text-xl font-bold text-espresso">Contactanos</h3>
                <p class="font-sans text-sm font-medium leading-relaxed opacity-90">
                    479 430 00 14
                </p>
            </div>

        </div>
    </footer>

    
    <script src="dsea.js"></script>
</body>
</html>
